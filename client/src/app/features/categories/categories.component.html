<div class="page-header">
  <div class="page-title-wrap">
    <h1>Categories</h1>
    <p class="page-desc">Organize your products by group</p>
  </div>
  <button mat-flat-button (click)="openDialog()">
    <mat-icon>add</mat-icon> Add Category
  </button>
</div>

@if (loading) {
  <div class="spinner-wrap">
    <mat-spinner diameter="48" />
  </div>
} @else {
  <mat-card>
    <mat-card-content>
      <table mat-table [dataSource]="categories" class="full-width">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let row">{{ row.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let row">{{ row.description || '—' }}</td>
        </ng-container>

        <ng-container matColumnDef="product_count">
          <th mat-header-cell *matHeaderCellDef>Products</th>
          <td mat-cell *matCellDef="let row">{{ row.product_count }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let row">
            <div class="actions-cell">
              <button mat-icon-button matTooltip="Edit" (click)="openDialog(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button matTooltip="Delete" color="warn" (click)="delete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns;"></tr>
      </table>

      @if (categories.length === 0) {
        <div class="empty-state">No categories found. Add one to get started.</div>
      }
    </mat-card-content>
  </mat-card>
}
